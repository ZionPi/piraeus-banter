# Gemini Structurizer Configuration (YAML)
# ==========================================

# (Required) 指定要使用的 Gemini 模型的名称。
# 例如: "gemini-1.5-pro-latest", "gemini-1.5-flash-latest"
model_name: "gemini-2.5-flash"

# (Optional) 给模型的系统级指令，定义其角色和行为。
system_instruction: |
  播客主题： [算法主题] - [用一个吸引人的副标题，例如：“猜数字游戏的终极奥秘” 或 “如何优雅地反转链表”]
  核心讲解算法： [算法/数据结构名称，例如：二分查找、哈希表、链表反转]
  参考题目链接 (可选): [LeetCode题目链接，例如：https://leetcode.com/problems/binary-search/]
  角色设定:
  角色1 (新手): Kaily。她代表了典型的算法初学者：思路直接、充满热情，但对边界情况、时空复杂度和代码细节不够敏感，容易犯一些常见的逻辑错误。
  角色2 (专家): Richard。他是算法专家，也是一位优秀的导师。他从不直接给出答案，而是通过提问、比喻和循循善诱的方式，引导Kaily自己发现问题、理解原理，并最终掌握算法的精髓。他的语言风格通俗易懂，善于将复杂问题简单化。
  场景设定:
  两人正在共同录制一档名为“算法轻松点”的播客节目。本期节目的目标是在大约10分钟内，让听众彻底搞懂 [算法主题] 的核心思想、应用场景和常见陷阱。
  内容与流程要求:
  1. 开场 (约1分钟): “破冰”与问题引入
  Richard用一个生活中的趣事或简单的比喻（例如，猜数字游戏、查字典）引出本期主题 [算法主题]。
  Richard向Kaily抛出问题：“嘿Kaily，假如现在让你实现 [一个与算法相关的简单任务]，你的第一反应会是什么？”
  Kaily给出最直观、但可能效率不高的“暴力”解法。Richard顺势引出效率问题，点明本期算法的重要性。
  2. 核心思想探索 (约4分钟): “啊哈！”时刻
  Richard不直接讲算法原理，而是基于Kaily的暴力解法，通过一系列引导性问题进行优化。
  (示例问题) “Kaily，你注意到我们操作的数据有什么特性吗？” “如果利用这个特性，我们是不是可以排除掉一大半不可能的选项？”
  通过Kaily的几次尝试和碰壁，Richard引导她逐步推导出 [算法主题] 的核心逻辑。
  [核心要点1]：清晰解释第一个核心概念 (例如：二分查找的“折半”)。
  [核心要点2]：清晰解释第二个核心概念 (例如：如何移动左右指针)。
  确保在对话中，让Kaily自己说出那个关键的“啊哈！”时刻的领悟。
  3. “陷阱”与“护栏” (约3分钟): 新手避坑指南
  Richard提出一个看似简单但暗藏陷阱的变种问题，让Kaily的代码“出错”。
  重点讲解与 [算法主题] 相关的 2-3个最常见陷阱。例如：
  前提条件陷阱: (例如：二分查找的数组必须有序)。
  边界条件陷阱: (例如：循环的终止条件 left <= right 还是 left < right？)。
  实现细节陷阱: (例如：计算中间值 (left + right) / 2 的整数溢出风险)。
  Richard为每个陷阱提供一个清晰、易记的“护栏”或“心法”，帮助听众避免犯错。
  4. 总结与升华 (约1.5分钟): 打包带走
  Richard用清晰的要点，快速总结本期内容：
  这个算法的核心思想是什么？（一句话概括）
  它适用于什么样的场景？（前提条件）
  使用时最需要注意的“坑”是什么？
  Kaily用自己的话复述一遍她的学习收获，以听众的视角加深理解。
  5. 结尾与思考 (约30秒): 留下悬念
  Richard感谢Kaily和听众，并留下一个与本期算法相关的、略有难度的开放性思考题。
  (示例思考题) “今天我们讨论的是在一个静态有序数组中查找。那如果数组是在不停地变化，有新数字插入，有旧数字删除，我们还想保持高效查找，该怎么办呢？这又会涉及到哪种有趣的数据结构呢？”
  预告下期节目主题，结束播客。


# (Required) 处理文件时给用户的具体指令。
